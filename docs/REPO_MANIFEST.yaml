schema_version: 1
name: ai-first
description: A versioned operating framework for AI-first projects
publication_class: public

entrypoints:
  charter: docs/AI_FIRST_CHARTER.md
  architecture: docs/ARCHITECTURE.md
  agent_harness: docs/agent-harness.md
  handoff: docs/HANDOFF.md
  status: docs/status.md
  roadmap: docs/roadmap.md
  completed_milestones: docs/completed-milestones.md
  publication: docs/PUBLICATION.md

active_work_glob: docs/todo-*/spec.md
active_work: docs/todo-stable-v1/spec.md
required_todo_files:
  - spec.md
  - open-questions.md

checks:
  full: scripts/check.sh
  harness: scripts/check-agent-harness-interface.sh
  generated: python3 .ai-first/check.py
  publication: scripts/check-publication-boundary.py
  ci_contract: scripts/check-ci-contract.py

ci:
  workflow: .github/workflows/ci.yml
  runner: ubuntu-24.04
  python: ["3.11", "3.14"]

publication:
  content_standard: public-ready
  remote: https://github.com/zrma/ai-first
  remote_status: published-public
  default_branch: main
  ci_status: passing
  private_vulnerability_reporting: enabled
  license_status: Apache-2.0
  policy: docs/PUBLICATION.md

vcs:
  local: jj
  default_bookmark: main
  change_message: "<type>: <summary>"
  push_requires_explicit_permission: true

runtime:
  status: selected
  implementation: dependency-free Python 3.11 standard library
  architecture: docs/ARCHITECTURE.md
