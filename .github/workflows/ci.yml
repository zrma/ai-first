name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pinned jj for real workspace integration tests
        run: |
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/jj.tar.gz" \
            https://github.com/jj-vcs/jj/releases/download/v0.45.1/jj-v0.45.1-x86_64-unknown-linux-musl.tar.gz
          echo "f35438350b5d61963aac5dd74ede510b31d6b9690769d1a6268cf058cc825f72  $RUNNER_TEMP/jj.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/jj-bin"
          tar -xzf "$RUNNER_TEMP/jj.tar.gz" -C "$RUNNER_TEMP/jj-bin" ./jj
          echo "$RUNNER_TEMP/jj-bin" >> "$GITHUB_PATH"

      - name: Run canonical checks
        env:
          AI_FIRST_REQUIRE_JJ_TESTS: "1"
        run: scripts/check.sh
